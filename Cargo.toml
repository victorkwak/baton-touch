[package]
name = "baton-touch"
version = "0.2.4"
edition = "2024"
rust-version = "1.89"
description = "Coordinate AI coding agents running on several machines through git: a shared append-only message board, lead/follower handoffs, and hooks that wake an idle agent only when a message needs it."
license = "Apache-2.0"
repository = "https://github.com/victorkwak/baton-touch"
homepage = "https://github.com/victorkwak/baton-touch"
readme = "README.md"
keywords = ["agents", "claude-code", "git", "coordination", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "baton"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
jiff = "0.2.39"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
ulid = "3.0.0"

[dev-dependencies]
tempfile = "3.27.0"
